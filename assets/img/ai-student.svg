<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Dirbtinio intelekto neuroninis tinklas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset="1" stop-color="#141b30"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="48" fill="url(#bg)"/>
  <circle cx="660" cy="140" r="90" fill="#ffffff" opacity=".55"/>
  <circle cx="110" cy="690" r="120" fill="#ffffff" opacity=".4"/>

  <!-- neuroninis tinklas -->
  <g stroke="#9db8ee" stroke-width="3" opacity=".9">
    <!-- 1 -> 2 sluoksnis -->
    <line x1="150" y1="200" x2="330" y2="150"/><line x1="150" y1="200" x2="330" y2="270"/><line x1="150" y1="200" x2="330" y2="390"/>
    <line x1="150" y1="320" x2="330" y2="150"/><line x1="150" y1="320" x2="330" y2="270"/><line x1="150" y1="320" x2="330" y2="390"/>
    <line x1="150" y1="440" x2="330" y2="150"/><line x1="150" y1="440" x2="330" y2="270"/><line x1="150" y1="440" x2="330" y2="390"/>
    <!-- 2 -> 3 sluoksnis -->
    <line x1="330" y1="150" x2="510" y2="210"/><line x1="330" y1="150" x2="510" y2="330"/>
    <line x1="330" y1="270" x2="510" y2="210"/><line x1="330" y1="270" x2="510" y2="330"/>
    <line x1="330" y1="390" x2="510" y2="210"/><line x1="330" y1="390" x2="510" y2="330"/>
    <!-- 3 -> isvestis -->
    <line x1="510" y1="210" x2="670" y2="270"/><line x1="510" y1="330" x2="670" y2="270"/>
  </g>
  <g fill="#ffffff" stroke="#4f8cff" stroke-width="5">
    <circle cx="150" cy="200" r="24"/><circle cx="150" cy="320" r="24"/><circle cx="150" cy="440" r="24"/>
    <circle cx="330" cy="150" r="24"/><circle cx="330" cy="270" r="24"/><circle cx="330" cy="390" r="24"/>
    <circle cx="510" cy="210" r="24"/><circle cx="510" cy="330" r="24"/>
  </g>
  <circle cx="670" cy="270" r="30" fill="#4f8cff"/>
  <circle cx="330" cy="270" r="12" fill="#4f8cff"/><circle cx="510" cy="330" r="12" fill="#4f8cff"/><circle cx="150" cy="320" r="12" fill="#4f8cff"/>

  <!-- procesorius -->
  <g stroke="#2b3550" stroke-width="8" stroke-linecap="round">
    <line x1="300" y1="530" x2="300" y2="562"/><line x1="350" y1="530" x2="350" y2="562"/><line x1="400" y1="530" x2="400" y2="562"/><line x1="450" y1="530" x2="450" y2="562"/><line x1="500" y1="530" x2="500" y2="562"/>
    <line x1="300" y1="740" x2="300" y2="708"/><line x1="350" y1="740" x2="350" y2="708"/><line x1="400" y1="740" x2="400" y2="708"/><line x1="450" y1="740" x2="450" y2="708"/><line x1="500" y1="740" x2="500" y2="708"/>
    <line x1="260" y1="590" x2="228" y2="590"/><line x1="260" y1="635" x2="228" y2="635"/><line x1="260" y1="680" x2="228" y2="680"/>
    <line x1="540" y1="590" x2="572" y2="590"/><line x1="540" y1="635" x2="572" y2="635"/><line x1="540" y1="680" x2="572" y2="680"/>
  </g>
  <rect x="260" y="560" width="280" height="150" rx="22" fill="url(#chip)"/>
  <rect x="276" y="576" width="248" height="118" rx="14" fill="none" stroke="#4f8cff" stroke-width="3" opacity=".6"/>
  <text x="400" y="662" text-anchor="middle" font-family="monospace" font-size="72" font-weight="700" fill="#4f8cff">AI</text>

  <!-- ryšys tarp tinklo ir procesoriaus -->
  <path d="M150 440 C150 520 260 520 300 560" fill="none" stroke="#9db8ee" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M670 270 C700 420 580 500 500 560" fill="none" stroke="#9db8ee" stroke-width="3" stroke-dasharray="8 8"/>
</svg>
